# Deploy the static Photo Effects site to GitHub Pages.
# Settings → Pages → Source must be "GitHub Actions" (not "Deploy from a branch").
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling (avoids "Deployment cancelled").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Official pattern: upload in build, deploy in a separate job.
  # Attempt-scoped artifact names avoid "Multiple artifacts named github-pages"
  # when upload retries or a job is re-run within the same workflow run.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site bundle
        run: |
          set -euo pipefail
          mkdir -p _site
          # Static PWA: publish repo contents, skip git/CI/build junk.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='.cursor/' \
            ./ _site/
          # Ensure Jekyll is skipped on Pages (folders like assets stay intact).
          touch _site/.nojekyll

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
