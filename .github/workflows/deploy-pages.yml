# Publish the static Photo Effects site to the gh-pages branch.
#
# REQUIRED after merge (one-time):
#   Settings → Pages → Build and deployment → Source
#     → Deploy from a branch
#     → Branch: gh-pages / folder: / (root)
#
# Why not actions/deploy-pages?
#   With Source = "GitHub Actions", deploy-pages creates a deployment that
#   stays stuck in deployment_queued until its 10-minute timeout
#   ("Timeout reached, aborting!"). That is a GitHub Pages backend issue
#   (see actions/deploy-pages#406), not a problem with this repo's build.
#   Publishing an orphan gh-pages branch uses the classic branch publisher,
#   which has been reliable for this site.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Queue deploys instead of cancelling mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare site bundle
        run: |
          set -euo pipefail
          mkdir -p _site
          # Static PWA: publish repo contents, skip git/CI/build junk.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='.cursor/' \
            ./ _site/
          # Ensure Jekyll is skipped on Pages (folders like assets stay intact).
          touch _site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: 'deploy: ${{ github.sha }}'
